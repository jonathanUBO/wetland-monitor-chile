version: '3.8'

services:
  # 1. FastAPI Backend (Sentinel-2 GeoEngine)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - BACKEND_URL=${BACKEND_URL:-}
      # Institutional Copernicus CDSE credentials (optional)
      - CDSE_USERNAME=${CDSE_USERNAME:-}
      - CDSE_PASSWORD=${CDSE_PASSWORD:-}
      - CDSE_CLIENT_ID=${CDSE_CLIENT_ID:-}
      - CDSE_CLIENT_SECRET=${CDSE_CLIENT_SECRET:-}
    networks:
      - wetland-net

  # 2. Next.js Frontend (GEOINT Interactive Console)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - backend
    networks:
      - wetland-net

  # 3. Nginx Reverse Proxy (Unified Portal Gateway)
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - wetland-net

networks:
  wetland-net:
    driver: bridge
